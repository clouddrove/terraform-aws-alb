---
name: tf-checks
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
jobs:
  alb:
    uses: clouddrove/github-shared-workflows/.github/workflows/tf-checks.yml@master
    with:
      working_directory: './example/alb/'
      provider: none
      terraform_version: 1.10.0
  nlb:
    uses: clouddrove/github-shared-workflows/.github/workflows/tf-checks.yml@master
    with:
      working_directory: './example/nlb/'
      provider: none
      terraform_version: 1.10.0
  clb:
    uses: clouddrove/github-shared-workflows/.github/workflows/tf-checks.yml@master
    with:
      working_directory: './example/clb/'
      provider: none
      terraform_version: 1.10.0
...
